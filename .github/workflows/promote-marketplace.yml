name: Promote stable marketplace

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published stable release tag
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
  STABLE_BRANCH: marketplace/stable

concurrency:
  group: marketplace-stable
  cancel-in-progress: false

jobs:
  promote:
    name: Promote published release to marketplace/stable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout trusted promotion automation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - name: Validate stable tag input
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "stable marketplace promotion requires vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
      - name: Checkout immutable release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: release-source
          fetch-depth: 0
          fetch-tags: true
      - name: Restore annotated release tag
        working-directory: release-source
        shell: bash
        run: >-
          git fetch --force
          "https://github.com/${GITHUB_REPOSITORY}.git"
          "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify published stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --json isDraft,isPrerelease,publishedAt,tagName
          )"
          jq -e \
            --arg tag "$RELEASE_TAG" \
            '.tagName == $tag and
              .isDraft == false and
              .isPrerelease == false and
              .publishedAt != null' \
            <<<"$release_json" >/dev/null
      - name: Validate release and marketplace contracts
        shell: bash
        run: |
          set -euo pipefail
          env -u GITHUB_SHA node \
            release-source/scripts/build-release-artifacts.mjs \
            --validate-only \
            --tag "$RELEASE_TAG"
          env -u GITHUB_SHA node \
            automation/scripts/validate-marketplace-promotion.mjs \
            --root release-source \
            --tag "$RELEASE_TAG"
      - name: Promote release commit
        working-directory: release-source
        shell: bash
        run: |
          set -euo pipefail
          tag_commit="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          if git ls-remote \
            --exit-code \
            --heads \
            origin \
            "refs/heads/${STABLE_BRANCH}" >/dev/null 2>&1
          then
            git fetch \
              origin \
              "refs/heads/${STABLE_BRANCH}:refs/remotes/origin/${STABLE_BRANCH}"
            if ! git merge-base \
              --is-ancestor \
              "refs/remotes/origin/${STABLE_BRANCH}" \
              "$tag_commit"
            then
              echo \
                "${RELEASE_TAG} is older than or unrelated to ${STABLE_BRANCH}; refusing to move the stable channel backward" \
                >&2
              exit 1
            fi
          fi

          git update-ref refs/heads/marketplace-promotion "$tag_commit"
          git push \
            origin \
            "refs/heads/marketplace-promotion:refs/heads/${STABLE_BRANCH}"

          promoted_commit="$(
            git ls-remote \
              --heads \
              origin \
              "refs/heads/${STABLE_BRANCH}" |
              awk '{print $1}'
          )"
          if [[ "$promoted_commit" != "$tag_commit" ]]; then
            echo "remote stable channel does not match ${RELEASE_TAG}" >&2
            exit 1
          fi
          {
            echo "### Stable marketplace promoted"
            echo
            echo "- Tag: \`${RELEASE_TAG}\`"
            echo "- Commit: \`${tag_commit}\`"
            echo "- Branch: \`${STABLE_BRANCH}\`"
          } >>"$GITHUB_STEP_SUMMARY"

name: Promote stable marketplace

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published stable release tag
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
  STABLE_BRANCH: marketplace/stable

concurrency:
  group: marketplace-stable
  cancel-in-progress: false

jobs:
  promote:
    name: Promote published release to marketplace/stable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout trusted promotion automation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - name: Validate stable tag input
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "stable marketplace promotion requires vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
      - name: Checkout immutable release
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: release-source
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Restore annotated release tag
        working-directory: release-source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git_auth="$(
            printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0
          )"
          echo "::add-mask::${git_auth}"
          git \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${git_auth}" \
            fetch --force \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Verify published stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --json isDraft,isPrerelease,publishedAt,tagName
          )"
          jq -e \
            --arg tag "$RELEASE_TAG" \
            '.tagName == $tag and
              .isDraft == false and
              .isPrerelease == false and
              .publishedAt != null' \
            <<<"$release_json" >/dev/null
      - name: Fetch current stable channel
        id: current-stable
        working-directory: release-source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git_auth="$(
            printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0
          )"
          echo "::add-mask::${git_auth}"
          if git \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${git_auth}" \
            ls-remote \
            --exit-code \
            --heads \
            origin \
            "refs/heads/${STABLE_BRANCH}" >/dev/null 2>&1
          then
            git \
              -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${git_auth}" \
              fetch \
              origin \
              "refs/heads/${STABLE_BRANCH}:refs/remotes/origin/${STABLE_BRANCH}"
            current_version="$(
              git show \
                "refs/remotes/origin/${STABLE_BRANCH}:package.json" |
                jq -er '.version'
            )"
            echo "version=${current_version}" >>"$GITHUB_OUTPUT"
            current_source_revision="$(
              git show \
                "refs/remotes/origin/${STABLE_BRANCH}:distribution-provenance.json" |
                jq -r '.sourceRevision // empty'
            )"
            if [[ -n "$current_source_revision" ]]; then
              if [[ ! "$current_source_revision" =~ ^[a-f0-9]{40}$ ]]; then
                echo "${STABLE_BRANCH} declares an invalid source revision" >&2
                exit 1
              fi
              echo "source_revision=${current_source_revision}" >>"$GITHUB_OUTPUT"
            fi
          fi
      - name: Validate release and marketplace contracts
        env:
          CURRENT_STABLE_VERSION: ${{ steps.current-stable.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          env -u GITHUB_SHA node \
            release-source/scripts/build-release-artifacts.mjs \
            --validate-only \
            --tag "$RELEASE_TAG"
          promotion_arguments=(
            --root release-source
            --tag "$RELEASE_TAG"
          )
          if [[ -n "$CURRENT_STABLE_VERSION" ]]; then
            promotion_arguments+=(
              --current-version "$CURRENT_STABLE_VERSION"
            )
          fi
          env -u GITHUB_SHA node \
            automation/scripts/validate-marketplace-promotion.mjs \
            "${promotion_arguments[@]}" \
            --materialize
      - name: Promote release commit
        working-directory: release-source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git_auth="$(
            printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0
          )"
          echo "::add-mask::${git_auth}"
          tag_commit="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          if git show-ref \
            --verify \
            --quiet \
            "refs/remotes/origin/${STABLE_BRANCH}"
          then
            current_source_revision="${{ steps.current-stable.outputs.source_revision }}"
            if [[ -n "$current_source_revision" ]]; then
              if ! git merge-base \
                --is-ancestor \
                "$current_source_revision" \
                "$tag_commit"
              then
                echo \
                  "${RELEASE_TAG} is older than or unrelated to the source revision on ${STABLE_BRANCH}; refusing to move the stable channel backward" \
                  >&2
                exit 1
              fi
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distribution-provenance.json
          git commit -m "Record ${RELEASE_TAG} marketplace provenance"
          promotion_commit="$(git rev-parse HEAD)"
          if [[ "$(git rev-parse HEAD^)" != "$tag_commit" ]]; then
            echo "marketplace provenance commit is not based directly on ${RELEASE_TAG}" >&2
            exit 1
          fi

          git update-ref refs/heads/marketplace-promotion "$promotion_commit"
          push_arguments=(
            origin
            "refs/heads/marketplace-promotion:refs/heads/${STABLE_BRANCH}"
          )
          if git show-ref \
            --verify \
            --quiet \
            "refs/remotes/origin/${STABLE_BRANCH}"
          then
            current_stable_commit="$(
              git rev-parse "refs/remotes/origin/${STABLE_BRANCH}"
            )"
            push_arguments=(
              --force-with-lease="refs/heads/${STABLE_BRANCH}:${current_stable_commit}"
              "${push_arguments[@]}"
            )
          fi
          git \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${git_auth}" \
            push \
            "${push_arguments[@]}"

          promoted_commit="$(
            git \
              -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${git_auth}" \
              ls-remote \
              --heads \
              origin \
              "refs/heads/${STABLE_BRANCH}" |
              awk '{print $1}'
          )"
          if [[ "$promoted_commit" != "$promotion_commit" ]]; then
            echo "remote stable channel does not match the provenance commit for ${RELEASE_TAG}" >&2
            exit 1
          fi
          {
            echo "### Stable marketplace promoted"
            echo
            echo "- Tag: \`${RELEASE_TAG}\`"
            echo "- Commit: \`${tag_commit}\`"
            echo "- Provenance commit: \`${promotion_commit}\`"
            echo "- Branch: \`${STABLE_BRANCH}\`"
          } >>"$GITHUB_STEP_SUMMARY"

name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  compatibility-required:
    name: Compatibility / required offline deterministic
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CI: true
      GITHUB_BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate plugin release boundary identities
        run: npm run validate:plugin-release -- --base-ref "origin/${GITHUB_BASE_REF}"
      - name: Run token-free offline compatibility gate
        shell: bash
        run: env -u OPENAI_API_KEY npm run compatibility:required

  node:
    name: Node 20 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    env:
      CODEX_HOME: ${{ github.workspace }}/.ci/codex-home
      CI: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check release notes before merge and tagging
        env:
          RELEASE_NOTES_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_NOTES_BASE" || "$RELEASE_NOTES_BASE" =~ ^0+$ ]]; then
            RELEASE_NOTES_BASE=origin/main
          fi
          npm run release:notes -- --base-ref "$RELEASE_NOTES_BASE"
      - run: npm run check
      - run: npm run corpus:validate
      - run: npm test

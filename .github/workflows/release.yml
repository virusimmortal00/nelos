name: Draft release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable annotated release tag
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  compatibility-exact:
    name: Release compatibility / Codex ${{ matrix.codex }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        codex: ["0.144.5", "0.144.6"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - run: mkdir -p compatibility-reports .ci/codex
      - name: Install exact public Codex package
        run: >-
          npm install
          --prefix .ci/codex
          --no-save
          --package-lock=false
          --ignore-scripts
          @openai/codex@${{ matrix.codex }}
      - name: Collect exact-ref public source evidence
        id: source
        continue-on-error: true
        run: >-
          node scripts/collect-compatibility-evidence.mjs
          --lane source-release
          --release-id codex@${{ matrix.codex }}
          --out compatibility-reports/source.json
      - name: Collect exact generated-schema evidence
        id: schema
        continue-on-error: true
        run: >-
          node scripts/collect-compatibility-evidence.mjs
          --lane schema
          --release-id codex@${{ matrix.codex }}
          --codex .ci/codex/node_modules/.bin/codex
          --out compatibility-reports/schema.json
      - name: Collect exact runtime-transport evidence
        id: runtime
        continue-on-error: true
        shell: bash
        run: |
          node scripts/collect-runtime-transport.mjs \
            --codex .ci/codex/node_modules/.bin/codex \
            --expected-version "${{ matrix.codex }}" \
            > compatibility-reports/runtime.json
      - name: Bind all evidence to the exact supported Codex release
        if: always()
        run: >-
          node scripts/verify-release-compatibility-evidence.mjs
          --release-id codex@${{ matrix.codex }}
          --source compatibility-reports/source.json
          --schema compatibility-reports/schema.json
          --runtime compatibility-reports/runtime.json
          --out compatibility-reports/release-bundle.json
      - name: Upload exact release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-compatibility-${{ matrix.codex }}
          path: compatibility-reports/
          if-no-files-found: warn
          retention-days: 14

  verify:
    name: Release gate / Node 20 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    env:
      CODEX_HOME: ${{ github.workspace }}/.ci/codex-home
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Restore annotated release tag
        shell: bash
        run: >-
          git fetch --force
          "https://github.com/${GITHUB_REPOSITORY}.git"
          "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Verify annotated tag and coherent release metadata
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            env -u GITHUB_SHA node scripts/build-release-artifacts.mjs \
              --validate-only \
              --tag "$RELEASE_TAG"
          else
            node scripts/build-release-artifacts.mjs \
              --validate-only \
              --tag "$RELEASE_TAG"
          fi
      - run: npm run check
      - run: npm test
      - run: npm run verify:golden-loop
      - name: Verify clean install
        shell: bash
        run: |
          set -euo pipefail
          clean_install_output="$(mktemp)"
          node \
            --import ./scripts/test-bootstrap.mjs \
            --test \
            --test-reporter=tap \
            "--test-name-pattern=a clean isolated home bootstraps source and marketplace idempotently" \
            test/distribution-install.test.mjs | tee "$clean_install_output"
          grep -Eq '^# pass 1$' "$clean_install_output"
          grep -Eq '^# fail 0$' "$clean_install_output"
          grep -Eq \
            '^ok [0-9]+ - a clean isolated home bootstraps source and marketplace idempotently$' \
            "$clean_install_output"

  artifacts:
    name: Build reproducible release artifacts
    needs: [verify, compatibility-exact]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Restore annotated release tag
        shell: bash
        run: >-
          git fetch --force
          "https://github.com/${GITHUB_REPOSITORY}.git"
          "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build and compare package outputs
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            env -u GITHUB_SHA node scripts/build-release-artifacts.mjs \
              --tag "$RELEASE_TAG" \
              --out-dir dist/release
          else
            node scripts/build-release-artifacts.mjs \
              --tag "$RELEASE_TAG" \
              --out-dir dist/release
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nelos-release-${{ env.RELEASE_TAG }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create or refresh draft GitHub Release
    needs: [verify, artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nelos-release-${{ env.RELEASE_TAG }}
          path: dist/release
      - name: Verify downloaded release assets
        working-directory: dist/release
        run: sha256sum --check SHA256SUMS
      - name: Create or refresh the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mapfile -t assets < <(
            find dist/release -maxdepth 1 -type f \
              ! -name release-notes.md -print | sort
          )
          if draft="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --json isDraft \
              --jq .isDraft 2>release-view-error.txt
          )"; then
            if [[ "$draft" != "true" ]]; then
              echo "refusing to modify an already published release" >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --clobber \
              "${assets[@]}"
            gh release edit "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --draft \
              --title "Nelos $version" \
              --notes-file dist/release/release-notes.md
          elif grep -qi "release not found" release-view-error.txt; then
            gh release create "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --draft \
              --verify-tag \
              --title "Nelos $version" \
              --notes-file dist/release/release-notes.md \
              "${assets[@]}"
          else
            cat release-view-error.txt >&2
            exit 1
          fi

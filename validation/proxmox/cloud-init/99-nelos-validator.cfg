# Proxmox supplies a NoCloud seed for every clone. Keep cloned identity and
# access material per-instance, and leave package mutation to explicit builds.
datasource_list: [NoCloud, ConfigDrive]
preserve_hostname: false
disable_root: true
ssh_pwauth: false
ssh_deletekeys: true
ssh_genkeytypes: [ed25519, ecdsa, rsa]
package_update: false
package_upgrade: false

growpart:
  mode: auto
  devices: [/]
  ignore_growroot_disabled: false

resize_rootfs: true

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nelos execution map</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #1a1d24;
        --muted: #667085;
        --surface: #ffffff;
        --surface-subtle: #f5f6f8;
        --border: #e3e5e9;
        --accent: #6457d9;
        --accent-soft: #efedff;
        --success: #18794e;
        --success-soft: #eaf8f0;
        --archived: #667085;
        --archived-soft: #f2f4f7;
        --warning: #9a6700;
        --warning-soft: #fff6d8;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f4f4f5;
          --muted: #a1a1aa;
          --surface: #18181b;
          --surface-subtle: #242429;
          --border: #34343b;
          --accent: #a79cf8;
          --accent-soft: #302b55;
          --success: #74d6a4;
          --success-soft: #193b2d;
          --archived: #a1a1aa;
          --archived-soft: #2b2b31;
          --warning: #f3c969;
          --warning-soft: #443818;
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: 0;
        min-height: 100%;
        margin: 0;
      }

      body {
        background: transparent;
        color: var(--ink);
        padding: 14px;
      }

      main {
        display: grid;
        gap: 10px;
        max-width: 760px;
        margin: 0 auto;
      }

      .groups {
        display: grid;
        gap: 8px;
      }

      .member-group {
        min-width: 0;
      }

      .group-summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        line-height: 1.3;
        padding: 7px 4px;
        user-select: none;
      }

      .group-summary::marker {
        color: var(--accent);
      }

      .members {
        display: grid;
        gap: 8px;
        margin: 2px 0 0;
        padding: 0;
        list-style: none;
      }

      .member {
        display: grid;
        grid-template-columns: 10px minmax(0, 1fr);
        gap: 10px;
        align-items: start;
        border: 1px solid var(--border);
        border-radius: 13px;
        background: var(--surface);
        padding: 11px 12px;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        margin-top: 6px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .member[data-status="created"] .status-dot,
      .member[data-status="complete"] .status-dot,
      .member[data-status="accepted"] .status-dot {
        background: var(--success);
        box-shadow: 0 0 0 3px var(--success-soft);
      }

      .member[data-status="archived"] .status-dot {
        background: var(--archived);
        box-shadow: 0 0 0 3px var(--archived-soft);
      }

      .member[data-status="authorization-required"] .status-dot,
      .member[data-status="archiving"] .status-dot,
      .member[data-status="attention"] .status-dot {
        background: var(--warning);
        box-shadow: 0 0 0 3px var(--warning-soft);
      }

      .member[data-status="planning"] .status-dot,
      .member[data-status="launch-pending"] .status-dot,
      .member[data-status="running"] .status-dot,
      .member[data-status="archiving"] .status-dot {
        animation: status-pulse 1.8s ease-out infinite;
      }

      .member-main {
        min-width: 0;
      }

      .member-heading {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }

      .member-task {
        flex: 0 1 auto;
        margin: 0;
        font-size: 14px;
        font-weight: 700;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .member-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 7px;
      }

      .tag {
        border-radius: 7px;
        background: var(--surface-subtle);
        padding: 4px 7px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.2;
        overflow-wrap: anywhere;
      }

      .tag.lifecycle {
        font-weight: 600;
      }

      .tag.status {
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 700;
      }

      .tag.status[data-status="created"],
      .tag.status[data-status="complete"],
      .tag.status[data-status="accepted"] {
        background: var(--success-soft);
        color: var(--success);
      }

      .tag.status[data-status="authorization-required"],
      .tag.status[data-status="archiving"],
      .tag.status[data-status="attention"] {
        background: var(--warning-soft);
        color: var(--warning);
      }

      .tag.status[data-status="archived"],
      .tag.status[data-status="kept"] {
        background: var(--archived-soft);
        color: var(--archived);
      }

      @keyframes status-pulse {
        0% {
          transform: scale(0.9);
          opacity: 0.7;
        }
        50% {
          transform: scale(1.12);
          opacity: 1;
        }
        100% {
          transform: scale(0.9);
          opacity: 0.7;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .status-dot {
          animation: none !important;
        }
      }

      .empty {
        border: 1px dashed var(--border);
        border-radius: 13px;
        color: var(--muted);
        padding: 18px;
        text-align: center;
        font-size: 13px;
      }

      @media (max-width: 520px) {
        body {
          padding: 10px;
        }
      }
    </style>
  </head>
  <body>
    <main aria-live="polite">
      <div id="members" class="groups" aria-label="Nelos task workers"></div>
    </main>

    <script type="module">
      const membersElement = document.querySelector("#members");
      const pendingRequests = new Map();
      let nextRequestId = 0;

      const label = (value) =>
        String(value ?? "")
          .replaceAll("-", " ")
          .replace(/\b\w/g, (character) => character.toUpperCase());

      const tag = (value, className = "") => {
        const element = document.createElement("span");
        element.className = `tag ${className}`.trim();
        element.textContent = value;
        return element;
      };

      const memberItem = (member) => {
        const item = document.createElement("li");
        item.className = "member";
        item.dataset.status = String(member.status || "");

        const dot = document.createElement("span");
        dot.className = "status-dot";
        dot.setAttribute("aria-label", label(member.status));

        const content = document.createElement("div");
        content.className = "member-main";
        const title = document.createElement("p");
        title.className = "member-task";
        title.textContent = String(member.task || member.id || "Task");
        const status = String(member.status || "planned");
        const statusTag = tag(label(status), "status");
        statusTag.dataset.status = status;
        const heading = document.createElement("div");
        heading.className = "member-heading";
        heading.append(title, statusTag);

        const meta = document.createElement("div");
        meta.className = "member-meta";
        meta.append(
          tag(
            member.lifecycle === "spinoff" ? "Spin-off" : "Sub-agent",
            "lifecycle",
          ),
          tag(String(member.model || "host-default")),
          tag(`${label(member.reasoning || "host-default")} reasoning`),
        );
        if (member.threadId) {
          const threadTag = tag(`Task ${member.threadId}`);
          threadTag.title = "Native Codex task identifier";
          meta.append(threadTag);
        }

        content.append(heading, meta);
        item.append(dot, content);
        return item;
      };

      const memberGroup = (title, members, { archived = false } = {}) => {
        const group = document.createElement("details");
        group.className = "member-group";
        group.open = !archived && members.length <= 4;
        const summary = document.createElement("summary");
        summary.className = "group-summary";
        summary.textContent = `${title} (${members.length})`;
        const list = document.createElement("ol");
        list.className = "members";
        list.setAttribute("aria-label", title);
        list.append(...members.map(memberItem));
        group.append(summary, list);
        return group;
      };

      const render = (value) => {
        if (!value || value.view !== "execution-map") return;

        membersElement.replaceChildren();
        const members = Array.isArray(value.members) ? value.members : [];
        if (members.length === 0) {
          const empty = document.createElement("li");
          empty.className = "empty";
          empty.textContent = "No task members in this receipt.";
          membersElement.append(empty);
          return;
        }

        const active = members.filter(({ status }) => status !== "archived");
        const archived = members.filter(({ status }) => status === "archived");
        if (active.length > 0) {
          membersElement.append(memberGroup("Current tasks", active));
        }
        if (archived.length > 0) {
          membersElement.append(
            memberGroup("Archived history", archived, { archived: true }),
          );
        }
      };

      const renderToolResult = (value) => {
        render(value?.structuredContent ?? value);
      };

      const notify = (method, params) => {
        window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
      };

      const request = (method, params) =>
        new Promise((resolve, reject) => {
          const id = ++nextRequestId;
          pendingRequests.set(id, { resolve, reject });
          window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
        });

      window.addEventListener(
        "message",
        (event) => {
          if (event.source !== window.parent) return;
          const message = event.data;
          if (!message || message.jsonrpc !== "2.0") return;

          if (message.id !== undefined && pendingRequests.has(message.id)) {
            const pending = pendingRequests.get(message.id);
            pendingRequests.delete(message.id);
            if (message.error) pending.reject(message.error);
            else pending.resolve(message.result);
            return;
          }

          if (message.method === "ui/notifications/tool-result") {
            renderToolResult(message.params);
          }
        },
        { passive: true },
      );

      window.addEventListener(
        "openai:set_globals",
        (event) => {
          renderToolResult(event.detail?.globals?.toolOutput);
        },
        { passive: true },
      );

      const waiting = document.createElement("li");
      waiting.className = "empty";
      waiting.textContent = "Waiting for task state…";
      membersElement.append(waiting);
      renderToolResult(window.openai?.toolOutput);

      try {
        await request("ui/initialize", {
          appInfo: { name: "nelos-execution-map", version: "1.0.0" },
          appCapabilities: {},
          protocolVersion: "2026-01-26",
        });
        notify("ui/notifications/initialized", {});
      } catch (error) {
        console.debug("Nelos execution map bridge unavailable", error);
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nelos execution map</title>
    <style id="host-fonts"></style>
    <style>
      :root {
        color-scheme: light dark;
        --fallback-ink: #1a1d24;
        --fallback-muted: #667085;
        --fallback-surface: #ffffff;
        --fallback-surface-subtle: #f5f6f8;
        --fallback-border: #e3e5e9;
        --fallback-accent: #6457d9;
        --fallback-accent-soft: #efedff;
        --fallback-success: #18794e;
        --fallback-success-soft: #eaf8f0;
        --fallback-archived: #667085;
        --fallback-archived-soft: #f2f4f7;
        --fallback-warning: #9a6700;
        --fallback-warning-soft: #fff6d8;
        --nelos-safe-area-top: 0px;
        --nelos-safe-area-right: 0px;
        --nelos-safe-area-bottom: 0px;
        --nelos-safe-area-left: 0px;
        --ink: var(--color-text-primary, var(--fallback-ink));
        --muted: var(--color-text-secondary, var(--fallback-muted));
        --surface: var(--color-background-primary, var(--fallback-surface));
        --surface-subtle: var(
          --color-background-secondary,
          var(--fallback-surface-subtle)
        );
        --border: var(--color-border-primary, var(--fallback-border));
        --accent: var(--color-ring-primary, var(--fallback-accent));
        --accent-soft: var(
          --color-background-info,
          var(--fallback-accent-soft)
        );
        --success: var(--color-text-success, var(--fallback-success));
        --success-soft: var(
          --color-background-success,
          var(--fallback-success-soft)
        );
        --archived: var(--color-text-secondary, var(--fallback-archived));
        --archived-soft: var(
          --color-background-secondary,
          var(--fallback-archived-soft)
        );
        --warning: var(--color-text-warning, var(--fallback-warning));
        --warning-soft: var(
          --color-background-warning,
          var(--fallback-warning-soft)
        );
        font-family: var(
          --font-sans,
          ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif
        );
      }

      :root[data-theme="dark"] {
        --fallback-ink: #f4f4f5;
        --fallback-muted: #a1a1aa;
        --fallback-surface: #18181b;
        --fallback-surface-subtle: #242429;
        --fallback-border: #34343b;
        --fallback-accent: #a79cf8;
        --fallback-accent-soft: #302b55;
        --fallback-success: #74d6a4;
        --fallback-success-soft: #193b2d;
        --fallback-archived: #a1a1aa;
        --fallback-archived-soft: #2b2b31;
        --fallback-warning: #f3c969;
        --fallback-warning-soft: #443818;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) {
          --fallback-ink: #f4f4f5;
          --fallback-muted: #a1a1aa;
          --fallback-surface: #18181b;
          --fallback-surface-subtle: #242429;
          --fallback-border: #34343b;
          --fallback-accent: #a79cf8;
          --fallback-accent-soft: #302b55;
          --fallback-success: #74d6a4;
          --fallback-success-soft: #193b2d;
          --fallback-archived: #a1a1aa;
          --fallback-archived-soft: #2b2b31;
          --fallback-warning: #f3c969;
          --fallback-warning-soft: #443818;
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: 0;
        margin: 0;
      }

      body {
        background: transparent;
        color: var(--ink);
        padding:
          calc(14px + var(--nelos-safe-area-top))
          calc(14px + var(--nelos-safe-area-right))
          calc(14px + var(--nelos-safe-area-bottom))
          calc(14px + var(--nelos-safe-area-left));
      }

      main {
        display: grid;
        gap: 4px;
        max-width: 760px;
        margin: 0 auto;
      }

      .groups {
        display: grid;
        gap: 4px;
      }

      .group-actions {
        display: flex;
        justify-content: flex-end;
        min-height: 22px;
      }

      .group-actions[hidden] {
        display: none;
      }

      .bulk-toggle {
        appearance: none;
        border: 0;
        border-radius: var(--border-radius-sm, 5px);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        font-size: 11px;
        font-weight: 600;
        line-height: 1.25;
        min-height: 22px;
        padding: 3px 6px;
      }

      .bulk-toggle:hover {
        background: var(--surface-subtle);
        color: var(--ink);
      }

      .bulk-toggle:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .member-group {
        min-width: 0;
      }

      .group-summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        line-height: 1.3;
        padding: 3px;
        user-select: none;
      }

      .group-summary::marker {
        color: var(--accent);
      }

      .member-group[data-status="created"] > .group-summary::marker,
      .member-group[data-status="complete"] > .group-summary::marker,
      .member-group[data-status="accepted"] > .group-summary::marker {
        color: var(--success);
      }

      .member-group[data-status="archived"] > .group-summary::marker,
      .member-group[data-status="kept"] > .group-summary::marker {
        color: var(--archived);
      }

      .member-group[data-status="authorization-required"]
        > .group-summary::marker,
      .member-group[data-status="attention"] > .group-summary::marker,
      .member-group[data-status="archiving"] > .group-summary::marker {
        color: var(--warning);
      }

      .group-summary:focus-visible {
        border-radius: 5px;
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .members {
        display: grid;
        gap: 4px;
        margin: 1px 0 0;
        padding: 0;
        list-style: none;
      }

      .member {
        display: grid;
        grid-template-columns: 8px minmax(0, 1fr);
        gap: 7px;
        align-items: center;
        border: 1px solid var(--border);
        border-radius: var(--border-radius-md, 9px);
        background: var(--surface);
        padding: 7px 9px;
      }

      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 2px var(--accent-soft);
      }

      .member[data-status="created"] .status-dot,
      .member[data-status="complete"] .status-dot,
      .member[data-status="accepted"] .status-dot {
        background: var(--success);
        box-shadow: 0 0 0 2px var(--success-soft);
      }

      .member[data-status="archived"] .status-dot,
      .member[data-status="kept"] .status-dot {
        background: var(--archived);
        box-shadow: 0 0 0 2px var(--archived-soft);
      }

      .member[data-status="authorization-required"] .status-dot,
      .member[data-status="archiving"] .status-dot,
      .member[data-status="attention"] .status-dot {
        background: var(--warning);
        box-shadow: 0 0 0 2px var(--warning-soft);
      }

      .member[data-status="planning"] .status-dot,
      .member[data-status="launch-pending"] .status-dot,
      .member[data-status="running"] .status-dot,
      .member[data-status="archiving"] .status-dot {
        animation: status-pulse 1.8s ease-out infinite;
      }

      .member-main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
        min-width: 0;
      }

      .member-heading {
        min-width: 0;
      }

      .member-task {
        min-width: 0;
        margin: 0;
        font-size: 13px;
        font-weight: 700;
        line-height: 1.3;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .member-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        justify-content: flex-end;
      }

      .tag {
        border-radius: var(--border-radius-sm, 5px);
        background: var(--surface-subtle);
        padding: 2px 5px;
        color: var(--muted);
        font-size: 10px;
        line-height: 1.2;
        overflow-wrap: anywhere;
      }

      .tag.lifecycle {
        font-weight: 600;
      }

      .tag.task-id {
        min-width: 0;
        max-width: 180px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      @keyframes status-pulse {
        0% {
          transform: scale(0.9);
          opacity: 0.7;
        }
        50% {
          transform: scale(1.12);
          opacity: 1;
        }
        100% {
          transform: scale(0.9);
          opacity: 0.7;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .status-dot {
          animation: none !important;
        }
      }

      .empty {
        border: 1px dashed var(--border);
        border-radius: 13px;
        color: var(--muted);
        padding: 18px;
        text-align: center;
        font-size: 13px;
        margin: 0;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 520px) {
        body {
          padding:
            calc(8px + var(--nelos-safe-area-top))
            calc(8px + var(--nelos-safe-area-right))
            calc(8px + var(--nelos-safe-area-bottom))
            calc(8px + var(--nelos-safe-area-left));
        }

        .member {
          padding: 6px 8px;
        }

        .member-main {
          grid-template-columns: minmax(0, 1fr);
          gap: 3px;
        }

        .member-task {
          display: -webkit-box;
          overflow: hidden;
          white-space: normal;
          -webkit-box-orient: vertical;
          -webkit-line-clamp: 2;
        }

        .member-meta {
          min-width: 0;
          flex-wrap: nowrap;
          justify-content: flex-start;
          overflow: hidden;
        }

        .member-meta .tag {
          flex: 0 0 auto;
          white-space: nowrap;
        }

        .tag.task-id {
          flex: 1 1 auto;
          max-width: 132px;
        }
      }

      @media (pointer: coarse) {
        .group-summary,
        .bulk-toggle {
          min-height: 30px;
          padding-block: 7px;
        }
      }

      :root[data-touch="true"] .group-summary,
      :root[data-touch="true"] .bulk-toggle {
        min-height: 30px;
        padding-block: 7px;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="group-actions" class="group-actions" hidden>
        <button
          id="bulk-toggle"
          class="bulk-toggle"
          type="button"
          aria-controls="members"
          aria-expanded="false"
        >
          Expand active
        </button>
      </div>
      <div id="members" class="groups" aria-label="Nelos task workers"></div>
      <p
        id="update-status"
        class="sr-only"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      ></p>
    </main>

    <script type="module">
      const membersElement = document.querySelector("#members");
      const groupActionsElement = document.querySelector("#group-actions");
      const bulkToggleElement = document.querySelector("#bulk-toggle");
      const updateStatusElement = document.querySelector("#update-status");
      const hostFontsElement = document.querySelector("#host-fonts");
      const pendingRequests = new Map();
      let nextRequestId = 0;
      let currentViewKey = null;

      const STATUS_GROUPS = Object.freeze([
        { status: "planning", title: "Planning" },
        { status: "planned", title: "Planned" },
        { status: "authorization-required", title: "Authorization required" },
        { status: "launch-pending", title: "Launch pending" },
        { status: "created", title: "Created" },
        { status: "unknown", title: "Unknown" },
        { status: "running", title: "Running" },
        { status: "attention", title: "Attention" },
        { status: "complete", title: "Complete" },
        { status: "accepted", title: "Accepted" },
        { status: "archiving", title: "Archiving" },
        { status: "archived", title: "Archive" },
        { status: "kept", title: "Kept" },
      ]);
      const STATUS_GROUP_BY_STATUS = new Map(
        STATUS_GROUPS.map((definition) => [definition.status, definition]),
      );
      const ACTIVE_STATUSES = new Set([
        "planning",
        "planned",
        "authorization-required",
        "launch-pending",
        "created",
        "unknown",
        "running",
        "attention",
        "archiving",
      ]);
      const HOST_STYLE_VARIABLES = new Set([
        "--color-background-primary",
        "--color-background-secondary",
        "--color-background-info",
        "--color-background-success",
        "--color-background-warning",
        "--color-text-primary",
        "--color-text-secondary",
        "--color-text-success",
        "--color-text-warning",
        "--color-border-primary",
        "--color-ring-primary",
        "--font-sans",
        "--border-radius-sm",
        "--border-radius-md",
      ]);

      const label = (value) =>
        String(value ?? "")
          .replaceAll("-", " ")
          .replace(/\b\w/g, (character) => character.toUpperCase());

      const tag = (value, className = "") => {
        const element = document.createElement("span");
        element.className = `tag ${className}`.trim();
        element.textContent = value;
        return element;
      };

      const memberStatus = (member) => {
        const status = String(member?.status || "unknown");
        return STATUS_GROUP_BY_STATUS.has(status) ? status : "unknown";
      };

      const memberItem = (member, definition) => {
        const item = document.createElement("li");
        item.className = "member";
        item.dataset.status = definition.status;

        const dot = document.createElement("span");
        dot.className = "status-dot";
        dot.setAttribute("aria-hidden", "true");

        const content = document.createElement("div");
        content.className = "member-main";
        const title = document.createElement("p");
        title.className = "member-task";
        title.textContent = String(member.task || member.id || "Task");
        title.title = title.textContent;
        const heading = document.createElement("div");
        heading.className = "member-heading";
        heading.append(title);

        const meta = document.createElement("div");
        meta.className = "member-meta";
        meta.append(
          tag(
            member.lifecycle === "spinoff" ? "Spin-off" : "Sub-agent",
            "lifecycle",
          ),
          tag(String(member.model || "host-default")),
          tag(`${label(member.reasoning || "host-default")} reasoning`),
        );
        if (member.threadId) {
          const threadId = String(member.threadId);
          const threadTag = tag(`Task ${threadId}`, "task-id");
          threadTag.dataset.threadId = threadId;
          threadTag.title = `Native Codex task identifier: ${threadId}`;
          threadTag.setAttribute(
            "aria-label",
            `Native Codex task identifier ${threadId}`,
          );
          meta.append(threadTag);
        }

        content.append(heading, meta);
        item.append(dot, content);
        return item;
      };

      const memberGroup = (definition, members, open) => {
        const group = document.createElement("details");
        group.className = "member-group";
        group.dataset.status = definition.status;
        group.open = open;
        const summary = document.createElement("summary");
        summary.className = "group-summary";
        summary.dataset.status = definition.status;
        summary.textContent = `${definition.title} (${members.length})`;
        const list = document.createElement("ol");
        list.className = "members";
        list.setAttribute("aria-label", `${definition.title} tasks`);
        list.append(...members.map((member) => memberItem(member, definition)));
        group.append(summary, list);
        group.addEventListener("toggle", () => {
          updateBulkControl();
          reportSize();
        });
        return group;
      };

      const currentGroups = () =>
        Array.from(membersElement.querySelectorAll(".member-group"));

      const updateBulkControl = () => {
        const groups = currentGroups();
        groupActionsElement.hidden = groups.length < 2;
        if (groups.length < 2) return;

        const hasOpenGroup = groups.some(({ open }) => open);
        const hasActiveGroup = groups.some(({ dataset }) =>
          ACTIVE_STATUSES.has(dataset.status));
        bulkToggleElement.textContent = hasOpenGroup
          ? "Collapse all"
          : hasActiveGroup
          ? "Expand active"
          : "Expand all";
        bulkToggleElement.setAttribute(
          "aria-expanded",
          String(hasOpenGroup),
        );
      };

      bulkToggleElement.addEventListener("click", () => {
        const groups = currentGroups();
        const hasOpenGroup = groups.some(({ open }) => open);
        if (hasOpenGroup) {
          for (const group of groups) group.open = false;
        } else {
          const activeGroups = groups.filter(({ dataset }) =>
            ACTIVE_STATUSES.has(dataset.status));
          for (const group of activeGroups.length > 0 ? activeGroups : groups) {
            group.open = true;
          }
        }
        updateBulkControl();
        reportSize();
      });

      const viewKey = (value) =>
        `${String(value?.schemaVersion ?? "")}:${String(value?.task ?? "")}`;

      const nearestSummary = (status, summaries) => {
        if (!status) return undefined;
        if (summaries.has(status)) return summaries.get(status);
        const start = STATUS_GROUPS.findIndex(
          (definition) => definition.status === status,
        );
        if (start < 0) return summaries.values().next().value;
        for (let distance = 1; distance < STATUS_GROUPS.length; distance += 1) {
          const next = STATUS_GROUPS[start + distance]?.status;
          const previous = STATUS_GROUPS[start - distance]?.status;
          if (next && summaries.has(next)) return summaries.get(next);
          if (previous && summaries.has(previous)) return summaries.get(previous);
        }
        return undefined;
      };

      const announceUpdate = (memberCount, groupCount) => {
        const taskLabel = memberCount === 1 ? "task" : "tasks";
        const groupLabel = groupCount === 1 ? "status" : "statuses";
        updateStatusElement.textContent =
          `Execution map updated: ${memberCount} ${taskLabel} in ` +
          `${groupCount} ${groupLabel}.`;
      };

      const render = (value) => {
        if (!value || value.view !== "execution-map") return;

        const nextViewKey = viewKey(value);
        const preservePresentation = currentViewKey === nextViewKey;
        const previousGroups = currentGroups();
        const openStatuses = preservePresentation
          ? new Set(
              previousGroups
                .filter(({ open }) => open)
                .map(({ dataset }) => dataset.status),
            )
          : new Set();
        const focusedStatus = preservePresentation
          ? document.activeElement?.dataset?.status ?? null
          : null;
        const bulkHadFocus =
          preservePresentation && document.activeElement === bulkToggleElement;

        membersElement.replaceChildren();
        const members = Array.isArray(value.members) ? value.members : [];
        currentViewKey = nextViewKey;
        if (members.length === 0) {
          const empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "No task members in this receipt.";
          membersElement.append(empty);
          updateBulkControl();
          announceUpdate(0, 0);
          reportSize();
          return;
        }

        const groupedMembers = new Map(
          STATUS_GROUPS.map(({ status }) => [status, []]),
        );
        for (const member of members) {
          groupedMembers.get(memberStatus(member)).push(member);
        }
        const summaries = new Map();
        for (const definition of STATUS_GROUPS) {
          const statusMembers = groupedMembers.get(definition.status);
          if (statusMembers.length > 0) {
            const group = memberGroup(
              definition,
              statusMembers,
              openStatuses.has(definition.status),
            );
            summaries.set(definition.status, group.children[0]);
            membersElement.append(group);
          }
        }
        updateBulkControl();
        announceUpdate(members.length, summaries.size);
        const focusTarget = nearestSummary(focusedStatus, summaries) ??
          (bulkHadFocus && groupActionsElement.hidden
            ? summaries.values().next().value
            : undefined);
        focusTarget?.focus?.({
          preventScroll: true,
        });
        reportSize();
      };

      const applyHostContext = (context) => {
        if (!context || typeof context !== "object") return;
        const root = document.documentElement;
        if (context.theme === "light" || context.theme === "dark") {
          root.dataset.theme = context.theme;
          root.style.colorScheme = context.theme;
        }
        for (const [name, value] of Object.entries(
          context.styles?.variables ?? {},
        )) {
          if (HOST_STYLE_VARIABLES.has(name) && typeof value === "string") {
            root.style.setProperty(name, value);
          }
        }
        if (typeof context.styles?.css?.fonts === "string") {
          hostFontsElement.textContent = context.styles.css.fonts;
        }
        if (context.platform) root.dataset.platform = String(context.platform);
        if (typeof context.deviceCapabilities?.touch === "boolean") {
          root.dataset.touch = String(context.deviceCapabilities.touch);
        }
        if (context.safeAreaInsets) {
          for (const side of ["top", "right", "bottom", "left"]) {
            const value = Number(context.safeAreaInsets[side]);
            if (Number.isFinite(value) && value >= 0) {
              root.style.setProperty(
                `--nelos-safe-area-${side}`,
                `${value}px`,
              );
            }
          }
        }
        reportSize();
      };

      const renderToolResult = (value) => {
        render(value?.structuredContent ?? value);
      };

      const notify = (method, params) => {
        window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
      };

      const request = (method, params) =>
        new Promise((resolve, reject) => {
          const id = ++nextRequestId;
          pendingRequests.set(id, { resolve, reject });
          window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
        });

      let sizeReportScheduled = false;
      let lastReportedWidth = 0;
      let lastReportedHeight = 0;
      const reportSize = () => {
        if (sizeReportScheduled) return;
        sizeReportScheduled = true;
        window.requestAnimationFrame(() => {
          sizeReportScheduled = false;
          const root = document.documentElement;
          const previousHeight = root.style.height;
          root.style.height = "max-content";
          const height = Math.ceil(root.getBoundingClientRect().height);
          root.style.height = previousHeight;
          const width = Math.ceil(window.innerWidth);
          if (
            height <= 0 ||
            (width === lastReportedWidth && height === lastReportedHeight)
          ) {
            return;
          }
          lastReportedWidth = width;
          lastReportedHeight = height;
          notify("ui/notifications/size-changed", { width, height });
        });
      };

      window.addEventListener(
        "message",
        (event) => {
          if (event.source !== window.parent) return;
          const message = event.data;
          if (!message || message.jsonrpc !== "2.0") return;

          if (message.id !== undefined && pendingRequests.has(message.id)) {
            const pending = pendingRequests.get(message.id);
            pendingRequests.delete(message.id);
            if (message.error) pending.reject(message.error);
            else pending.resolve(message.result);
            return;
          }

          if (message.method === "ui/notifications/tool-result") {
            renderToolResult(message.params);
          } else if (
            message.method === "ui/notifications/host-context-changed"
          ) {
            applyHostContext(message.params);
          }
        },
        { passive: true },
      );

      window.addEventListener(
        "openai:set_globals",
        (event) => {
          renderToolResult(event.detail?.globals?.toolOutput);
        },
        { passive: true },
      );

      const waiting = document.createElement("p");
      waiting.className = "empty";
      waiting.textContent = "Waiting for task state…";
      membersElement.append(waiting);
      renderToolResult(window.openai?.toolOutput);

      try {
        const initialization = await request("ui/initialize", {
          appInfo: { name: "nelos-execution-map", version: "1.0.0" },
          appCapabilities: {},
          protocolVersion: "2026-01-26",
        });
        applyHostContext(initialization?.hostContext);
        notify("ui/notifications/initialized", {});
        if (typeof window.ResizeObserver === "function") {
          const sizeObserver = new window.ResizeObserver(reportSize);
          sizeObserver.observe(document.documentElement);
          sizeObserver.observe(document.body);
        }
        reportSize();
      } catch (error) {
        console.debug("Nelos execution map bridge unavailable", error);
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nelos execution map</title>
    <style id="host-fonts"></style>
    <style>
      :root {
        color-scheme: light dark;
        --fallback-ink: #1a1d24;
        --fallback-muted: #667085;
        --fallback-surface: #ffffff;
        --fallback-surface-subtle: #f5f6f8;
        --fallback-border: #e3e5e9;
        --fallback-accent: #6457d9;
        --fallback-accent-soft: #efedff;
        --fallback-success: #18794e;
        --fallback-success-soft: #eaf8f0;
        --fallback-archived: #667085;
        --fallback-archived-soft: #f2f4f7;
        --fallback-warning: #9a6700;
        --fallback-warning-soft: #fff6d8;
        --nelos-safe-area-top: 0px;
        --nelos-safe-area-right: 0px;
        --nelos-safe-area-bottom: 0px;
        --nelos-safe-area-left: 0px;
        --ink: var(--color-text-primary, var(--fallback-ink));
        --muted: var(--color-text-secondary, var(--fallback-muted));
        --surface: var(--color-background-primary, var(--fallback-surface));
        --surface-subtle: var(
          --color-background-secondary,
          var(--fallback-surface-subtle)
        );
        --border: var(--color-border-primary, var(--fallback-border));
        --accent: var(--color-ring-primary, var(--fallback-accent));
        --accent-soft: var(
          --color-background-info,
          var(--fallback-accent-soft)
        );
        --success: var(--color-text-success, var(--fallback-success));
        --success-soft: var(
          --color-background-success,
          var(--fallback-success-soft)
        );
        --archived: var(--color-text-secondary, var(--fallback-archived));
        --archived-soft: var(
          --color-background-secondary,
          var(--fallback-archived-soft)
        );
        --warning: var(--color-text-warning, var(--fallback-warning));
        --warning-soft: var(
          --color-background-warning,
          var(--fallback-warning-soft)
        );
        font-family: var(
          --font-sans,
          ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif
        );
      }

      :root[data-theme="dark"] {
        --fallback-ink: #f4f4f5;
        --fallback-muted: #a1a1aa;
        --fallback-surface: #18181b;
        --fallback-surface-subtle: #242429;
        --fallback-border: #34343b;
        --fallback-accent: #a79cf8;
        --fallback-accent-soft: #302b55;
        --fallback-success: #74d6a4;
        --fallback-success-soft: #193b2d;
        --fallback-archived: #a1a1aa;
        --fallback-archived-soft: #2b2b31;
        --fallback-warning: #f3c969;
        --fallback-warning-soft: #443818;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) {
          --fallback-ink: #f4f4f5;
          --fallback-muted: #a1a1aa;
          --fallback-surface: #18181b;
          --fallback-surface-subtle: #242429;
          --fallback-border: #34343b;
          --fallback-accent: #a79cf8;
          --fallback-accent-soft: #302b55;
          --fallback-success: #74d6a4;
          --fallback-success-soft: #193b2d;
          --fallback-archived: #a1a1aa;
          --fallback-archived-soft: #2b2b31;
          --fallback-warning: #f3c969;
          --fallback-warning-soft: #443818;
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: 0;
        margin: 0;
      }

      body {
        background: transparent;
        color: var(--ink);
        padding:
          calc(14px + var(--nelos-safe-area-top))
          calc(14px + var(--nelos-safe-area-right))
          calc(14px + var(--nelos-safe-area-bottom))
          calc(14px + var(--nelos-safe-area-left));
      }

      main {
        display: grid;
        gap: 4px;
        max-width: 760px;
        margin: 0 auto;
      }

      .task-context {
        display: flex;
        align-items: baseline;
        gap: 6px;
        min-width: 0;
        padding: 2px 3px 5px;
        border-bottom: 1px solid var(--border);
      }

      .task-context[hidden] {
        display: none;
      }

      .task-context-label {
        flex: 0 0 auto;
        color: var(--muted);
        font-size: 9px;
        font-weight: 750;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .task-context-value {
        min-width: 0;
        overflow: hidden;
        color: var(--ink);
        font-size: 12px;
        line-height: 1.35;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .groups {
        display: grid;
        gap: 4px;
      }

      .filters {
        display: flex;
        align-items: center;
        gap: 3px;
        min-width: 0;
        padding: 2px 0;
      }

      .filters[hidden],
      .filter-button[hidden] {
        display: none;
      }

      .filter-button {
        appearance: none;
        border: 1px solid transparent;
        border-radius: var(--border-radius-sm, 5px);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        font-size: 11px;
        font-weight: 600;
        line-height: 1.25;
        min-height: 22px;
        padding: 3px 6px;
      }

      .filter-button:hover {
        background: var(--surface-subtle);
        color: var(--ink);
      }

      .filter-button[aria-pressed="true"] {
        border-color: var(--border);
        background: var(--surface-subtle);
        color: var(--ink);
      }

      .filter-button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .member-group {
        min-width: 0;
      }

      .group-summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        line-height: 1.3;
        padding: 3px;
        user-select: none;
      }

      .group-summary::marker {
        color: var(--accent);
      }

      .member-group[data-group="done"] > .group-summary::marker {
        color: var(--success);
      }

      .member-group[data-group="history"] > .group-summary::marker {
        color: var(--archived);
      }

      .member-group[data-group="needs-input"] > .group-summary::marker {
        color: var(--warning);
      }

      .group-summary:focus-visible {
        border-radius: 5px;
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .members {
        display: grid;
        gap: 4px;
        margin: 1px 0 0;
        padding: 0;
        list-style: none;
      }

      .member {
        display: grid;
        grid-template-columns: 8px minmax(0, 1fr);
        gap: 7px;
        align-items: center;
        border: 1px solid var(--border);
        border-radius: var(--border-radius-md, 9px);
        background: var(--surface);
        padding: 7px 9px;
      }

      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 2px var(--accent-soft);
      }

      .member[data-status="created"] .status-dot,
      .member[data-status="complete"] .status-dot,
      .member[data-status="accepted"] .status-dot {
        background: var(--success);
        box-shadow: 0 0 0 2px var(--success-soft);
      }

      .member[data-status="archived"] .status-dot,
      .member[data-status="kept"] .status-dot {
        background: var(--archived);
        box-shadow: 0 0 0 2px var(--archived-soft);
      }

      .member[data-status="authorization-required"] .status-dot,
      .member[data-status="archiving"] .status-dot,
      .member[data-status="attention"] .status-dot {
        background: var(--warning);
        box-shadow: 0 0 0 2px var(--warning-soft);
      }

      .member[data-status="planning"] .status-dot,
      .member[data-status="launch-pending"] .status-dot,
      .member[data-status="running"] .status-dot,
      .member[data-status="archiving"] .status-dot {
        animation: status-pulse 1.8s ease-out infinite;
      }

      .member-main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
        min-width: 0;
      }

      .member-heading {
        min-width: 0;
      }

      .member-task {
        min-width: 0;
        margin: 0;
        font-size: 13px;
        font-weight: 700;
        line-height: 1.3;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .member-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        justify-content: flex-end;
      }

      .tag {
        border-radius: var(--border-radius-sm, 5px);
        background: var(--surface-subtle);
        padding: 2px 5px;
        color: var(--muted);
        font-size: 10px;
        line-height: 1.2;
        overflow-wrap: anywhere;
      }

      .tag.status {
        color: var(--ink);
        font-weight: 700;
      }

      .tag.lifecycle {
        font-weight: 600;
      }

      .tag.task-id {
        min-width: 0;
        max-width: 180px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      @keyframes status-pulse {
        0% {
          transform: scale(0.9);
          opacity: 0.7;
        }
        50% {
          transform: scale(1.12);
          opacity: 1;
        }
        100% {
          transform: scale(0.9);
          opacity: 0.7;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .status-dot {
          animation: none !important;
        }
      }

      .empty {
        border: 1px dashed var(--border);
        border-radius: 13px;
        color: var(--muted);
        padding: 18px;
        text-align: center;
        font-size: 13px;
        margin: 0;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 520px) {
        body {
          padding:
            calc(8px + var(--nelos-safe-area-top))
            calc(8px + var(--nelos-safe-area-right))
            calc(8px + var(--nelos-safe-area-bottom))
            calc(8px + var(--nelos-safe-area-left));
        }

        .member {
          padding: 6px 8px;
        }

        .member-main {
          grid-template-columns: minmax(0, 1fr);
          gap: 3px;
        }

        .member-task {
          display: -webkit-box;
          overflow: hidden;
          white-space: normal;
          -webkit-box-orient: vertical;
          -webkit-line-clamp: 2;
        }

        .member-meta {
          min-width: 0;
          flex-wrap: nowrap;
          justify-content: flex-start;
          overflow: hidden;
        }

        .member-meta .tag {
          flex: 0 0 auto;
          white-space: nowrap;
        }

        .tag.task-id {
          flex: 1 1 auto;
          max-width: 132px;
        }
      }

      @media (pointer: coarse) {
        .group-summary,
        .filter-button {
          min-height: 30px;
          padding-block: 7px;
        }
      }

      :root[data-touch="true"] .group-summary,
      :root[data-touch="true"] .filter-button {
        min-height: 30px;
        padding-block: 7px;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="task-context" class="task-context" hidden>
        <span id="task-context-label" class="task-context-label">Task</span>
        <strong id="task-context-value" class="task-context-value"></strong>
      </div>
      <nav id="filters" class="filters" aria-label="Filter task workers" hidden>
        <button id="filter-current" class="filter-button" type="button" aria-pressed="true">Current</button>
        <button id="filter-done" class="filter-button" type="button" aria-pressed="false">Done</button>
        <button id="filter-history" class="filter-button" type="button" aria-pressed="false">History</button>
      </nav>
      <div
        id="members"
        class="groups"
        role="group"
        aria-label="Nelos task workers"
      ></div>
      <p
        id="update-status"
        class="sr-only"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      ></p>
    </main>

    <script type="module">
      const membersElement = document.querySelector("#members");
      const taskContextElement = document.querySelector("#task-context");
      const taskContextLabelElement = document.querySelector(
        "#task-context-label",
      );
      const taskContextValueElement = document.querySelector(
        "#task-context-value",
      );
      const filtersElement = document.querySelector("#filters");
      const filterCurrentElement = document.querySelector("#filter-current");
      const filterDoneElement = document.querySelector("#filter-done");
      const filterHistoryElement = document.querySelector("#filter-history");
      const updateStatusElement = document.querySelector("#update-status");
      const hostFontsElement = document.querySelector("#host-fonts");
      const pendingRequests = new Map();
      let nextRequestId = 0;
      let currentViewKey = null;
      let currentFilter = "current";
      let currentOutput = null;
      const openGroupState = new Map();

      const STATUS_GROUPS = Object.freeze([
        { status: "planning", title: "Planning" },
        { status: "planned", title: "Planned" },
        { status: "authorization-required", title: "Authorization required" },
        { status: "launch-pending", title: "Launch pending" },
        { status: "created", title: "Created" },
        { status: "unknown", title: "Unknown" },
        { status: "running", title: "Running" },
        { status: "attention", title: "Attention" },
        { status: "complete", title: "Complete" },
        { status: "accepted", title: "Accepted" },
        { status: "archiving", title: "Archiving" },
        { status: "archived", title: "Archive" },
        { status: "kept", title: "Kept" },
      ]);
      const STATUS_GROUP_BY_STATUS = new Map(
        STATUS_GROUPS.map((definition) => [definition.status, definition]),
      );
      const FILTER_DEFINITIONS = Object.freeze([
        { key: "current", title: "Current" },
        { key: "done", title: "Done" },
        { key: "history", title: "History" },
      ]);
      const INTENT_GROUPS = Object.freeze([
        {
          key: "needs-input",
          title: "Needs input",
          filter: "current",
          statuses: ["authorization-required", "attention", "unknown"],
          defaultOpen: true,
        },
        {
          key: "in-progress",
          title: "In progress",
          filter: "current",
          statuses: ["planning", "running", "archiving"],
          defaultOpen: false,
        },
        {
          key: "queued",
          title: "Queued",
          filter: "current",
          statuses: ["planned", "launch-pending", "created"],
          defaultOpen: false,
        },
        {
          key: "done",
          title: "Done",
          filter: "done",
          statuses: ["complete", "accepted", "kept"],
          defaultOpen: false,
        },
        {
          key: "history",
          title: "History",
          filter: "history",
          statuses: ["archived"],
          defaultOpen: false,
        },
      ]);
      const INTENT_GROUP_BY_STATUS = new Map(
        INTENT_GROUPS.flatMap((definition) =>
          definition.statuses.map((status) => [status, definition])
        ),
      );
      const FILTER_BUTTONS = new Map([
        ["current", filterCurrentElement],
        ["done", filterDoneElement],
        ["history", filterHistoryElement],
      ]);
      const HOST_STYLE_VARIABLES = new Set([
        "--color-background-primary",
        "--color-background-secondary",
        "--color-background-info",
        "--color-background-success",
        "--color-background-warning",
        "--color-text-primary",
        "--color-text-secondary",
        "--color-text-success",
        "--color-text-warning",
        "--color-border-primary",
        "--color-ring-primary",
        "--font-sans",
        "--border-radius-sm",
        "--border-radius-md",
      ]);

      const label = (value) =>
        String(value ?? "")
          .replaceAll("-", " ")
          .replace(/\b\w/g, (character) => character.toUpperCase());

      const tag = (value, className = "") => {
        const element = document.createElement("span");
        element.className = `tag ${className}`.trim();
        element.textContent = value;
        return element;
      };

      const memberStatus = (member) => {
        const status = String(member?.status || "unknown");
        return STATUS_GROUP_BY_STATUS.has(status) ? status : "unknown";
      };

      const memberItem = (member, definition, standalone = false) => {
        const item = document.createElement(standalone ? "article" : "li");
        item.className = standalone ? "member single-member" : "member";
        item.dataset.status = definition.status;

        const dot = document.createElement("span");
        dot.className = "status-dot";
        dot.setAttribute("aria-hidden", "true");

        const content = document.createElement("div");
        content.className = "member-main";
        const title = document.createElement("p");
        title.className = "member-task";
        title.textContent = String(member.task || member.id || "Task");
        title.title = title.textContent;
        const heading = document.createElement("div");
        heading.className = "member-heading";
        heading.append(title);

        const meta = document.createElement("div");
        meta.className = "member-meta";
        meta.append(
          tag(definition.title, "status"),
          tag(
            member.lifecycle === "spinoff" ? "Spin-off" : "Sub-agent",
            "lifecycle",
          ),
          tag(String(member.model || "host-default")),
          tag(`${label(member.reasoning || "host-default")} reasoning`),
        );
        if (member.threadId) {
          const threadId = String(member.threadId);
          const threadTag = tag(`Task ${threadId}`, "task-id");
          threadTag.dataset.threadId = threadId;
          threadTag.title = `Native Codex task identifier: ${threadId}`;
          threadTag.setAttribute(
            "aria-label",
            `Native Codex task identifier ${threadId}`,
          );
          meta.append(threadTag);
        }

        content.append(heading, meta);
        item.append(dot, content);
        if (standalone) {
          item.setAttribute(
            "aria-label",
            `${definition.title} worker: ${title.textContent}`,
          );
        }
        return item;
      };

      const memberGroup = (definition, members, open) => {
        const group = document.createElement("details");
        group.className = "member-group";
        group.dataset.group = definition.key;
        group.open = open;
        const summary = document.createElement("summary");
        summary.className = "group-summary";
        summary.dataset.group = definition.key;
        summary.textContent = `${definition.title} (${members.length})`;
        const list = document.createElement("ol");
        list.className = "members";
        list.setAttribute("aria-label", `${definition.title} workers`);
        list.append(
          ...members.map((member) =>
            memberItem(
              member,
              STATUS_GROUP_BY_STATUS.get(memberStatus(member)),
            )
          ),
        );
        group.append(summary, list);
        group.addEventListener("toggle", () => {
          openGroupState.set(
            `${currentViewKey}:${currentFilter}:${definition.key}`,
            group.open,
          );
          reportSize();
        });
        return group;
      };

      const currentGroups = () =>
        Array.from(membersElement.querySelectorAll(".member-group"));

      const viewKey = (value) =>
        `${String(value?.schemaVersion ?? "")}:${String(value?.task ?? "")}`;

      const filterCounts = (members) => {
        const counts = new Map(FILTER_DEFINITIONS.map(({ key }) => [key, 0]));
        for (const member of members) {
          const filter = INTENT_GROUP_BY_STATUS.get(memberStatus(member)).filter;
          counts.set(filter, counts.get(filter) + 1);
        }
        return counts;
      };

      const updateFilterControls = (members) => {
        const counts = filterCounts(members);
        if ((counts.get(currentFilter) ?? 0) === 0) {
          currentFilter = FILTER_DEFINITIONS.find(
            ({ key }) => (counts.get(key) ?? 0) > 0,
          )?.key ?? "current";
        }
        let populated = 0;
        for (const definition of FILTER_DEFINITIONS) {
          const button = FILTER_BUTTONS.get(definition.key);
          const count = counts.get(definition.key) ?? 0;
          button.hidden = count === 0;
          if (count > 0) populated += 1;
          button.textContent = `${definition.title} ${count}`;
          button.setAttribute(
            "aria-pressed",
            String(currentFilter === definition.key),
          );
        }
        filtersElement.hidden = members.length <= 1 || populated <= 1;
      };

      const announceUpdate = (memberCount) => {
        const workerLabel = memberCount === 1 ? "worker" : "workers";
        const filterTitle = FILTER_DEFINITIONS.find(
          ({ key }) => key === currentFilter,
        )?.title ?? "Current";
        updateStatusElement.textContent =
          `Execution map updated: ${memberCount} ${workerLabel} shown in ` +
          `${filterTitle}.`;
      };

      const render = (value) => {
        if (!value || value.view !== "execution-map") return false;

        const nextViewKey = viewKey(value);
        const preservePresentation = currentViewKey === nextViewKey;
        const focusedGroup = preservePresentation
          ? document.activeElement?.dataset?.group ?? null
          : null;
        if (!preservePresentation) {
          currentFilter = "current";
          openGroupState.clear();
        }

        membersElement.replaceChildren();
        const members = Array.isArray(value.members) ? value.members : [];
        currentOutput = value;
        const contextValue = String(value.task || "Task web");
        taskContextLabelElement.textContent = "Task";
        taskContextValueElement.textContent = contextValue;
        taskContextValueElement.title = `Task: ${contextValue}`;
        taskContextElement.hidden = false;
        currentViewKey = nextViewKey;
        updateFilterControls(members);
        if (members.length === 0) {
          const empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "No task members in this receipt.";
          membersElement.append(empty);
          announceUpdate(0);
          reportSize();
          return true;
        }

        if (members.length === 1) {
          const member = members[0];
          const definition = STATUS_GROUP_BY_STATUS.get(memberStatus(member));
          const directMember = memberItem(member, definition, true);
          membersElement.append(directMember);
          announceUpdate(1);
          reportSize();
          return true;
        }

        const visibleMembers = members.filter((member) =>
          INTENT_GROUP_BY_STATUS.get(memberStatus(member)).filter ===
            currentFilter
        );
        if (currentFilter !== "current") {
          membersElement.append(
            ...visibleMembers.map((member) =>
              memberItem(
                member,
                STATUS_GROUP_BY_STATUS.get(memberStatus(member)),
                true,
              )
            ),
          );
          announceUpdate(visibleMembers.length);
          reportSize();
          return true;
        }

        const groupedMembers = new Map(
          INTENT_GROUPS
            .filter(({ filter }) => filter === "current")
            .map(({ key }) => [key, []]),
        );
        for (const member of visibleMembers) {
          groupedMembers.get(
            INTENT_GROUP_BY_STATUS.get(memberStatus(member)).key,
          ).push(member);
        }
        const summaries = new Map();
        for (const definition of INTENT_GROUPS) {
          if (definition.filter !== "current") continue;
          const groupMembers = groupedMembers.get(definition.key);
          if (groupMembers.length > 0) {
            const stateKey = `${currentViewKey}:${currentFilter}:${definition.key}`;
            const group = memberGroup(
              definition,
              groupMembers,
              openGroupState.get(stateKey) ?? definition.defaultOpen,
            );
            summaries.set(definition.key, group.children[0]);
            membersElement.append(group);
          }
        }
        announceUpdate(visibleMembers.length);
        const focusTarget = focusedGroup
          ? summaries.get(focusedGroup) ?? summaries.values().next().value
          : undefined;
        focusTarget?.focus?.({
          preventScroll: true,
        });
        reportSize();
        return true;
      };

      for (const [filter, button] of FILTER_BUTTONS) {
        button.addEventListener("click", () => {
          if (currentFilter === filter || !currentOutput) return;
          currentFilter = filter;
          render(currentOutput);
        });
      }

      const applyHostContext = (context) => {
        if (!context || typeof context !== "object") return;
        const root = document.documentElement;
        if (context.theme === "light" || context.theme === "dark") {
          root.dataset.theme = context.theme;
          root.style.colorScheme = context.theme;
        }
        if (
          context.styles &&
          Object.prototype.hasOwnProperty.call(context.styles, "variables")
        ) {
          for (const name of HOST_STYLE_VARIABLES) {
            root.style.removeProperty(name);
          }
          for (const [name, value] of Object.entries(
            context.styles.variables ?? {},
          )) {
            if (HOST_STYLE_VARIABLES.has(name) && typeof value === "string") {
              root.style.setProperty(name, value);
            }
          }
        }
        if (typeof context.styles?.css?.fonts === "string") {
          hostFontsElement.textContent = context.styles.css.fonts;
        }
        if (context.platform) root.dataset.platform = String(context.platform);
        if (typeof context.deviceCapabilities?.touch === "boolean") {
          root.dataset.touch = String(context.deviceCapabilities.touch);
        }
        if (context.safeAreaInsets) {
          for (const side of ["top", "right", "bottom", "left"]) {
            const value = Number(context.safeAreaInsets[side]);
            if (Number.isFinite(value) && value >= 0) {
              root.style.setProperty(
                `--nelos-safe-area-${side}`,
                `${value}px`,
              );
            }
          }
        }
        reportSize();
      };

      const renderToolResult = (value) => {
        const output = value?.structuredContent ?? value;
        if (output && !render(output)) {
          taskContextElement.hidden = true;
          filtersElement.hidden = true;
          taskContextValueElement.textContent = "";
          taskContextValueElement.title = "";
          const unavailable = document.createElement("p");
          unavailable.className = "empty";
          unavailable.textContent = "Worker status unavailable.";
          membersElement.replaceChildren(unavailable);
          reportSize();
        }
      };

      const notify = (method, params) => {
        window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
      };

      const request = (method, params) =>
        new Promise((resolve, reject) => {
          const id = ++nextRequestId;
          pendingRequests.set(id, { resolve, reject });
          window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
        });

      let sizeReportScheduled = false;
      let lastReportedWidth = 0;
      let lastReportedHeight = 0;
      const reportSize = () => {
        if (sizeReportScheduled) return;
        sizeReportScheduled = true;
        window.requestAnimationFrame(() => {
          sizeReportScheduled = false;
          const root = document.documentElement;
          const previousHeight = root.style.height;
          root.style.height = "max-content";
          const height = Math.ceil(root.getBoundingClientRect().height);
          root.style.height = previousHeight;
          const width = Math.ceil(window.innerWidth);
          if (
            height <= 0 ||
            (width === lastReportedWidth && height === lastReportedHeight)
          ) {
            return;
          }
          lastReportedWidth = width;
          lastReportedHeight = height;
          notify("ui/notifications/size-changed", { width, height });
        });
      };

      window.addEventListener(
        "message",
        (event) => {
          if (event.source !== window.parent) return;
          const message = event.data;
          if (!message || message.jsonrpc !== "2.0") return;

          if (message.id !== undefined && pendingRequests.has(message.id)) {
            const pending = pendingRequests.get(message.id);
            pendingRequests.delete(message.id);
            if (message.error) pending.reject(message.error);
            else pending.resolve(message.result);
            return;
          }

          if (message.method === "ui/notifications/tool-result") {
            renderToolResult(message.params);
          } else if (
            message.method === "ui/notifications/host-context-changed"
          ) {
            applyHostContext(message.params);
          }
        },
        { passive: true },
      );

      window.addEventListener(
        "openai:set_globals",
        (event) => {
          renderToolResult(event.detail?.globals?.toolOutput);
        },
        { passive: true },
      );

      const loading = document.createElement("p");
      loading.className = "empty";
      loading.textContent = "Loading worker state…";
      membersElement.append(loading);
      renderToolResult(window.openai?.toolOutput);

      try {
        const initialization = await request("ui/initialize", {
          appInfo: { name: "nelos-execution-map", version: "1.0.0" },
          appCapabilities: {},
          protocolVersion: "2026-01-26",
        });
        applyHostContext(initialization?.hostContext);
        notify("ui/notifications/initialized", {});
        if (typeof window.ResizeObserver === "function") {
          const sizeObserver = new window.ResizeObserver(reportSize);
          sizeObserver.observe(document.documentElement);
          sizeObserver.observe(document.body);
        }
        reportSize();
      } catch (error) {
        console.debug("Nelos execution map bridge unavailable", error);
      }
    </script>
  </body>
</html>

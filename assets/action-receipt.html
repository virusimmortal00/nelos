<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nelos action receipt</title>
    <style id="host-fonts"></style>
    <style>
      :root {
        color-scheme: light dark;
        --ink: var(--color-text-primary, #1a1d24);
        --muted: var(--color-text-secondary, #667085);
        --border: var(--color-border-primary, #e3e5e9);
        --success: var(--color-text-success, #18794e);
        --warning: var(--color-text-warning, #9a6700);
        --subtle: var(--color-background-secondary, #f5f6f8);
        --top: 0px;
        --right: 0px;
        --bottom: 0px;
        --left: 0px;
        font-family: var(--font-sans, ui-sans-serif, system-ui, sans-serif);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) {
          --ink: #f4f4f5;
          --muted: #a1a1aa;
          --border: #34343b;
          --success: #74d6a4;
          --warning: #f3c969;
          --subtle: #242429;
        }
      }
      :root[data-theme="dark"] {
        --ink: #f4f4f5;
        --muted: #a1a1aa;
        --border: #34343b;
        --success: #74d6a4;
        --warning: #f3c969;
        --subtle: #242429;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-width: 0; }
      body {
        background: transparent;
        color: var(--ink);
        padding: calc(11px + var(--top)) calc(12px + var(--right))
          calc(11px + var(--bottom)) calc(12px + var(--left));
      }
      main { max-width: 680px; margin: 0 auto; }
      .receipt { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 9px; align-items: center; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); }
      .receipt[data-status="attention"] .dot,
      .receipt[data-status="authorization-required"] .dot,
      .receipt[data-status="archiving"] .dot { background: var(--warning); }
      .copy { min-width: 0; }
      h2 { margin: 0; font-size: 13px; line-height: 1.35; }
      .subject { display: flex; gap: 4px; min-width: 0; margin: 2px 0 0; color: var(--muted); font-size: 11px; }
      .subject-label { flex: 0 0 auto; font-weight: 650; }
      .subject-value { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .metrics { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; }
      .metric { border-radius: var(--border-radius-sm, 5px); background: var(--subtle); color: var(--muted); padding: 3px 6px; font-size: 10px; white-space: nowrap; }
      .metric strong { color: var(--ink); font-weight: 700; }
      .message { margin: 0; border: 1px dashed var(--border); border-radius: 9px; color: var(--muted); padding: 12px; text-align: center; font-size: 12px; }
      @media (max-width: 520px) {
        .receipt { grid-template-columns: 8px minmax(0, 1fr); }
        .metrics { grid-column: 2; justify-content: flex-start; }
      }
    </style>
  </head>
  <body>
    <main id="root"><p class="message">Processing action…</p></main>
    <script type="module">
      const root = document.querySelector("#root");
      const hostFonts = document.querySelector("#host-fonts");
      const pending = new Map();
      let nextId = 0;
      const HOST_STYLE_VARIABLES = new Set([
        "--color-background-secondary",
        "--color-text-primary",
        "--color-text-secondary",
        "--color-text-success",
        "--color-text-warning",
        "--color-border-primary",
        "--font-sans",
        "--border-radius-sm",
      ]);
      const node = (name, className, text) => {
        const element = document.createElement(name);
        if (className) element.className = className;
        if (text !== undefined) element.textContent = text;
        return element;
      };
      const render = (value, delivered = true) => {
        if (!value && !delivered) return;
        if (!value || value.view !== "action-receipt") {
          root.replaceChildren(node("p", "message", "Action result unavailable."));
          reportSize();
          return;
        }
        const receipt = node("section", "receipt");
        receipt.dataset.status = String(value.status || "complete");
        const dot = node("span", "dot");
        dot.setAttribute("aria-hidden", "true");
        const copy = node("div", "copy");
        const subjectLabel = value.kind === "cleanup" ? "Scope" : "Work unit";
        const subjectValue = String(
          value.detail || "Nelos lifecycle action recorded",
        );
        const subject = node("p", "subject");
        subject.title = `${subjectLabel}: ${subjectValue}`;
        subject.append(
          node("span", "subject-label", `${subjectLabel} ·`),
          node("span", "subject-value", subjectValue),
        );
        copy.append(
          node("h2", "", String(value.title || "Action recorded")),
          subject,
        );
        const metrics = node("div", "metrics");
        for (const item of Array.isArray(value.metrics) ? value.metrics : []) {
          if (!item || typeof item !== "object") continue;
          const metric = node("span", "metric");
          const label = node("span", "", `${String(item.label).replaceAll("-", " ")} `);
          const amount = node("strong", "", String(item.value));
          metric.append(label, amount);
          metrics.append(metric);
        }
        receipt.append(dot, copy, metrics);
        root.replaceChildren(receipt);
        reportSize();
      };
      const renderToolResult = (value, delivered = true) =>
        render(value?.structuredContent ?? value, delivered);
      const notify = (method, params) => window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
      const request = (method, params) => new Promise((resolve, reject) => {
        const id = ++nextId;
        const timeoutId = window.setTimeout(() => {
          pending.delete(id);
          reject(new Error(`${method} timed out`));
        }, 3000);
        pending.set(id, { resolve, reject, timeoutId });
        window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
      });
      let scheduled = false;
      let lastWidth = 0;
      let lastHeight = 0;
      const reportSize = () => {
        if (scheduled) return;
        scheduled = true;
        window.requestAnimationFrame(() => {
          scheduled = false;
          const documentRoot = document.documentElement;
          const previousHeight = documentRoot.style.height;
          documentRoot.style.height = "max-content";
          const height = Math.ceil(documentRoot.getBoundingClientRect().height);
          documentRoot.style.height = previousHeight;
          const width = Math.ceil(window.innerWidth);
          if (height <= 0 || (width === lastWidth && height === lastHeight)) return;
          lastWidth = width;
          lastHeight = height;
          notify("ui/notifications/size-changed", { width, height });
        });
      };
      const applyContext = (context) => {
        if (!context || typeof context !== "object") return;
        const documentRoot = document.documentElement;
        if (["light", "dark"].includes(context.theme)) {
          documentRoot.dataset.theme = context.theme;
          documentRoot.style.colorScheme = context.theme;
        }
        if (Object.prototype.hasOwnProperty.call(context.styles ?? {}, "variables")) {
          for (const name of HOST_STYLE_VARIABLES) documentRoot.style.removeProperty(name);
          for (const [name, value] of Object.entries(context.styles?.variables ?? {})) {
            if (HOST_STYLE_VARIABLES.has(name) && typeof value === "string") {
              documentRoot.style.setProperty(name, value);
            }
          }
        }
        if (typeof context.styles?.css?.fonts === "string") hostFonts.textContent = context.styles.css.fonts;
        for (const side of ["top", "right", "bottom", "left"]) {
          const value = Number(context.safeAreaInsets?.[side]);
          if (Number.isFinite(value) && value >= 0) documentRoot.style.setProperty(`--${side}`, `${value}px`);
        }
        reportSize();
      };
      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;
        if (message.id !== undefined && pending.has(message.id)) {
          const entry = pending.get(message.id);
          pending.delete(message.id);
          window.clearTimeout(entry.timeoutId);
          if (message.error) entry.reject(message.error); else entry.resolve(message.result);
        } else if (message.method === "ui/notifications/tool-result") {
          renderToolResult(message.params);
        } else if (message.method === "ui/notifications/host-context-changed") {
          applyContext(message.params);
        }
      }, { passive: true });
      window.addEventListener("openai:set_globals", (event) => {
        const toolOutput = event.detail?.globals?.toolOutput;
        if (toolOutput === undefined) return;
        renderToolResult(toolOutput);
      }, { passive: true });
      renderToolResult(window.openai?.toolOutput, false);
      try {
        const initialized = await request("ui/initialize", {
          appInfo: { name: "nelos-action-receipt", version: "1.0.0" },
          appCapabilities: {},
          protocolVersion: "2026-01-26",
        });
        applyContext(initialized?.hostContext);
        notify("ui/notifications/initialized", {});
      } catch (error) {
        console.debug("Nelos action receipt bridge unavailable", error);
      }
      if (typeof window.ResizeObserver === "function") {
        const observer = new window.ResizeObserver(reportSize);
        observer.observe(document.documentElement);
        observer.observe(document.body);
      }
      reportSize();
    </script>
  </body>
</html>
